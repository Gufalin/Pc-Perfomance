<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Performance</title>
    <style>
        /* =========================
   PC PERFORMANCE — PREMIUM
========================= */
* {
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(88, 101, 242, 0.16),
            transparent 38%
        ),
        #0b0d12;
    color: white;
    text-align: center;
    min-height: 100vh;
}
/* =========================
   CONTENEDOR
========================= */
.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 55px 20px 70px;
}
/* =========================
   CABECERA
========================= */
h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;
    background:
        linear-gradient(
            135deg,
            #ffffff 20%,
            #aeb5ff 80%
        );
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
p {
    margin-top: 12px;
    color: #858b9b;
    font-size: 15px;
}
/* =========================
   CALCULADORA
========================= */
.calculator {
    position: relative;
    margin-top: 38px;
    padding: 30px;
    background:
        linear-gradient(
            145deg,
            rgba(30, 34, 46, 0.96),
            rgba(19, 22, 30, 0.96)
        );
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 22px;
    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
    overflow: hidden;
}
/* Línea superior de la tarjeta */
.calculator::before {
    content: "";
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(88, 101, 242, 0.8),
            transparent
        );
}
/* =========================
   GRID
========================= */
.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    width: 100%;
}
.form-full {
    grid-column: 1 / -1;
}
/* =========================
   SELECTORES
========================= */
select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    min-height: 54px;
    padding: 0 45px 0 17px;
    margin-top: 0;
    border-radius: 13px;
    border: 1px solid #303644;
    outline: none;
    background-color: #171a22;
    color: #dfe2ea;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    background-image:
        linear-gradient(
            45deg,
            transparent 50%,
            #777f91 50%
        ),
        linear-gradient(
            135deg,
            #777f91 50%,
            transparent 50%
        );
    background-position:
        calc(100% - 20px) 50%,
        calc(100% - 14px) 50%;
    background-size:
        6px 6px,
        6px 6px;
    background-repeat: no-repeat;
    transition:
        border-color 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}
select:hover {
    background-color: #1b1f29;
    border-color: #41495a;
}
select:focus {
    border-color: #5865f2;
    background-color: #1b1f29;
    box-shadow:
        0 0 0 3px rgba(88, 101, 242, 0.12);
}
select option {
    background: #171a22;
    color: white;
}
/* =========================
   CONTENEDORES
========================= */
.game-container,
.gpu-container,
.cpu-container {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-width: 0;
}
/* =========================
   JUEGO
========================= */
.game-container select,
.gpu-container select,
.cpu-container select {
    flex: 1;
    min-width: 0;
}
#game-preview {
    width: 55px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
#game-preview img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter:
        drop-shadow(
            0 4px 8px rgba(0, 0, 0, 0.4)
        );
}
/* =========================
   GPU
========================= */
#gpu-preview {
    flex: 0 0 155px;
    min-width: 0;
}
.gpu-info {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 54px;
    padding: 6px 9px;
    background:
        linear-gradient(
            135deg,
            #222733,
            #1b1f29
        );
    border: 1px solid #303644;
    border-radius: 12px;
    text-align: left;
}
.gpu-info img {
    width: 46px;
    height: 40px;
    object-fit: contain;
    flex-shrink: 0;
}
.gpu-info div {
    display: flex;
    flex-direction: column;
    min-width: 0;
}
.gpu-info strong {
    font-size: 12px;
    color: #f1f3f8;
    white-space: nowrap;
}
.gpu-info span {
    margin-top: 3px;
    color: #858c9d;
    font-size: 10px;
    white-space: nowrap;
}
/* =========================
   CPU
========================= */
#cpu-preview {
    width: 55px;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
#cpu-preview img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    filter:
        drop-shadow(
            0 4px 8px rgba(0, 0, 0, 0.4)
        );
}
/* =========================
   BOTÓN
========================= */
button {
    width: 100%;
    min-height: 64px;

    margin-top: 22px;
    padding: 0 24px;

    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;

    background: linear-gradient(
        135deg,
        #263b8f,
        #3156c9
    );

    color: #ffffff;

    font-size: 15px;
    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(35, 67, 160, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}

button:hover {
    transform: translateY(-2px);

    filter: brightness(1.12);

    box-shadow:
        0 12px 32px rgba(35, 67, 160, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

button:active {
    transform: translateY(0);

    box-shadow:
        0 5px 15px rgba(35, 67, 160, 0.2);
}
/* =========================
   RESULTADO
========================= */
#result {
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
}
.result-card {
    position: relative;
    margin-top: 25px;
    padding: 26px;
    background:
        linear-gradient(
            145deg,
            #202531,
            #181c25
        );
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.25);
}
.result-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 1px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(88, 101, 242, 0.7),
            transparent
        );
}
.result-card h2 {
    margin: 0 0 5px;
    font-size: 18px;
    color: #dfe2ea;
}
.fps-number {
    margin: 10px 0 15px;
    font-size: clamp(40px, 8vw, 52px);
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    text-shadow:
        0 4px 20px rgba(88, 101, 242, 0.25);
}
.result-info {
    color: #8e95a5;
    font-size: 14px;
    line-height: 1.9;
}
/* =========================
   BARRA DE RENDIMIENTO
========================= */
.performance-bar {
    width: 100%;
    height: 12px;
    margin-top: 20px;
    background: #10131a;
    border: 1px solid #292e39;
    border-radius: 20px;
    overflow: hidden;
}
.performance-fill {
    height: 100%;
    background:
        linear-gradient(
            90deg,
            #4652d8,
            #6974ff
        );
    border-radius: 20px;
    transition:
        width 0.7s cubic-bezier(
            0.22,
            1,
            0.36,
            1
        );
}
/* =========================
   MÓVIL
========================= */
@media (max-width: 600px) {
    .container {
        padding: 32px 12px 50px;
    }
    h1 {
        font-size: 34px;
    }
    p {
        font-size: 14px;
    }
    .calculator {
        margin-top: 28px;
        padding: 17px;
        border-radius: 18px;
    }
    .form-grid {
        grid-template-columns: 1fr;
        gap: 11px;
    }
    .form-full {
        grid-column: auto;
    }
    select {
        min-height: 52px;
        font-size: 14px;
    }
    #gpu-preview {
        flex: 0 0 135px;
    }
    .gpu-info {
        min-height: 52px;
        padding: 5px 7px;
    }
    .gpu-info img {
        width: 40px;
        height: 36px;
    }
    .gpu-info strong {
        font-size: 11px;
    }
    .gpu-info span {
        font-size: 9px;
    }
    #game-preview,
    #cpu-preview {
        width: 50px;
        height: 52px;
    }
    #game-preview img,
    #cpu-preview img {
        width: 43px;
        height: 43px;
    }
    button {
        min-height: 58px;
        margin-top: 17px;
    }
    .result-card {
        padding: 22px 17px;
    }
}
/* =========================
   MÓVIL HORIZONTAL
========================= */
@media (min-width: 601px) and (max-height: 500px) {
    .container {
        padding-top: 25px;
        padding-bottom: 40px;
    }
    h1 {
        font-size: 36px;
    }
}
    </style>
</head>
<body>
<div class="container">
    <h1>PC Performance</h1>
    <p>
        Calcula el rendimiento estimado de tu PC.
    </p>
    <div class="calculator">
        <!-- =========================
             SELECCIÓN
        ========================= -->
        <div class="form-grid">
            <!-- JUEGO -->
            <div class="game-container form-full">
                <select id="game" onchange="showGame()">
                    <option value="">
                        Juego...
                    </option>
                    <option value="fortnite">
                        Fortnite
                    </option>
                    <option value="cyberpunk">
                        Cyberpunk 2077
                    </option>
                    <option value="warzone">
                        Call of Duty: Warzone
                    </option>
                </select>
                <div id="game-preview"></div>
            </div>
            <!-- GPU -->
            <div class="gpu-container">
                <select id="gpu" onchange="showGPU()">
                    <option value="">
                        GPU...
                    </option>
                    <option value="rtx3080">
                        RTX 3080
                    </option>
                    <option value="rtx4070">
                        RTX 4070
                    </option>
                    <option value="rtx5070">
                        RTX 5070
                    </option>
                </select>
                <div id="gpu-preview"></div>
            </div>
            <!-- CPU -->
            <div class="cpu-container">
                <select id="cpu" onchange="showCPU()">
                    <option value="">
                        CPU...
                    </option>
                    <option value="i5-14600kf">
                        i5-14600KF
                    </option>
                    <option value="ryzen 7 7800X3D">
                        Ryzen 7 7800X3D
                    </option>
                    <option value="ryzen 5 7600">
                        Ryzen 5 7600
                    </option>
                </select>
                <div id="cpu-preview"></div>
            </div>
            <!-- RESOLUCIÓN -->
            <select id="resolution">
                <option value="">
                    Resolución...
                </option>
                <option value="1080">
                    1080p
                </option>
                <option value="1440">
                    1440p
                </option>
                <option value="2160">
                    4K
                </option>
            </select>
            <!-- OBJETIVO -->
            <select id="target">
                <option value="">
                    Objetivo...
                </option>
                <option value="competitive">
                    Competitivo
                </option>
                <option value="balanced">
                    Equilibrado
                </option>
                <option value="quality">
                    Calidad
                </option>
            </select>
        </div>
        <!-- BOTÓN -->
        <button onclick="calculateFPS()">
            CALCULAR RENDIMIENTO
        </button>
        <!-- RESULTADO -->
        <div id="result"></div>
    </div>
</div>
<script>
/* =========================
   DATOS DE FPS
========================= */
let fpsData = {
    fortnite: {
        rtx3080: {
            "i5-14600kf": {
                "1080": {
                    competitive: 324,
                    balanced: 228,
                    quality: 177
                },
                "1440": {
                    competitive: 206,
                    balanced: 145,
                    quality: 112
                },
                "2160": {
                    competitive: 109,
                    balanced: 77,
                    quality: 59
                }
            },
            "ryzen 5 7600": {
                "1080": {
                    competitive: 310,
                    balanced: 220,
                    quality: 170
                },
                "1440": {
                    competitive: 195,
                    balanced: 140,
                    quality: 108
                },
                "2160": {
                    competitive: 105,
                    balanced: 75,
                    quality: 57
                }
            },
            "ryzen 7 7800X3D": {
                "1080": {
                    competitive: 350,
                    balanced: 235,
                    quality: 180
                },
                "1440": {
                    competitive: 215,
                    balanced: 150,
                    quality: 115
                },
                "2160": {
                    competitive: 112,
                    balanced: 79,
                    quality: 60
                }
            }
        },
        rtx4070: {
            "i5-14600kf": {
                "1080": {
                    competitive: 350,
                    balanced: 245,
                    quality: 185
                },
                "1440": {
                    competitive: 215,
                    balanced: 155,
                    quality: 115
                },
                "2160": {
                    competitive: 115,
                    balanced: 80,
                    quality: 62
                }
            },
            "ryzen 5 7600": {
                "1080": {
                    competitive: 320,
                    balanced: 230,
                    quality: 175
                },
                "1440": {
                    competitive: 190,
                    balanced: 165,
                    quality: 120
                },
                "2160": {
                    competitive: 105,
                    balanced: 82,
                    quality: 64
                }
            },
            "ryzen 7 7800X3D": {
                "1080": {
                    competitive: 338,
                    balanced: 241,
                    quality: 184
                },
                "1440": {
                    competitive: 213,
                    balanced: 151,
                    quality: 115
                },
                "2160": {
                    competitive: 116,
                    balanced: 78,
                    quality: 61
                }
            }
        },
        rtx5070: {
            "i5-14600kf": {
                "1080": {
                    competitive: 362,
                    balanced: 260,
                    quality: 201
                },
                "1440": {
                    competitive: 233,
                    balanced: 161,
                    quality: 125
                },
                "2160": {
                    competitive: 122,
                    balanced: 87,
                    quality: 70
                }
            },
            "ryzen 5 7600": {
                "1080": {
                    competitive: 340,
                    balanced: 245,
                    quality: 190
                },
                "1440": {
                    competitive: 205,
                    balanced: 150,
                    quality: 118
                },
                "2160": {
                    competitive: 110,
                    balanced: 84,
                    quality: 68
                }
            },
            "ryzen 7 7800X3D": {
                "1080": {
                    competitive: 390,
                    balanced: 270,
                    quality: 205
                },
                "1440": {
                    competitive: 250,
                    balanced: 170,
                    quality: 130
                },
                "2160": {
                    competitive: 128,
                    balanced: 92,
                    quality: 73
                }
            }
        }
    }
};
/* =========================
   IMAGEN DEL JUEGO
========================= */
function showGame() {
    let game =
        document.getElementById("game").value;
    if (game === "fortnite") {
        document.getElementById("game-preview").innerHTML =
            '<img src="./fortnite.PNG">';
    }
    else if (game === "cyberpunk") {
        document.getElementById("game-preview").innerHTML =
            '<img src="./cyberpunk.JPG">';
    }
    else if (game === "warzone") {
        document.getElementById("game-preview").innerHTML =
            '<img src="./warzone.PNG">';
    }
    else {
        document.getElementById("game-preview").innerHTML = "";
    }
}
/* =========================
   IMAGEN + VRAM GPU
========================= */
function showGPU() {
    let gpu =
        document.getElementById("gpu").value;
    if (gpu === "rtx3080") {
        document.getElementById("gpu-preview").innerHTML =
            '<div class="gpu-info">' +
                '<img src="./rtx3080.PNG">' +
                '<div>' +
                    '<strong>RTX 3080</strong>' +
                    '<span>10 GB VRAM</span>' +
                '</div>' +
            '</div>';
    }
    else if (gpu === "rtx4070") {
        document.getElementById("gpu-preview").innerHTML =
            '<div class="gpu-info">' +
                '<img src="./rtx4070.PNG">' +
                '<div>' +
                    '<strong>RTX 4070</strong>' +
                    '<span>12 GB VRAM</span>' +
                '</div>' +
            '</div>';
    }
    else if (gpu === "rtx5070") {
        document.getElementById("gpu-preview").innerHTML =
            '<div class="gpu-info">' +
                '<img src="./rtx5070.PNG">' +
                '<div>' +
                    '<strong>RTX 5070</strong>' +
                    '<span>12 GB VRAM</span>' +
                '</div>' +
            '</div>';
    }
    else {
        document.getElementById("gpu-preview").innerHTML = "";
    }
}
/* =========================
   IMAGEN CPU
========================= */
function showCPU() {
    let cpu =
        document.getElementById("cpu").value;
    if (cpu === "i5-14600kf") {
        document.getElementById("cpu-preview").innerHTML =
            '<img src="./i5-14600kf.PNG">';
    }
    else if (cpu === "ryzen 7 7800X3D") {
        document.getElementById("cpu-preview").innerHTML =
            '<img src="./ryzen7-7800x3d.PNG">';
    }
    else if (cpu === "ryzen 5 7600") {
        document.getElementById("cpu-preview").innerHTML =
            '<img src="./ryzen5-7600.WEBP">';
    }
    else {
        document.getElementById("cpu-preview").innerHTML = "";
    }
}
/* =========================
   CALCULAR FPS
========================= */
function calculateFPS() {
    let game =
        document.getElementById("game").value;
    let gpu =
        document.getElementById("gpu").value;
    let cpu =
        document.getElementById("cpu").value;
    let resolution =
        document.getElementById("resolution").value;
    let target =
        document.getElementById("target").value;
    /* COMPROBAR CAMPOS */
    if (
        !game ||
        !gpu ||
        !cpu ||
        !resolution ||
        !target
    ) {
        document.getElementById("result").innerHTML =
            "Selecciona todos los campos.";
        return;
    }
    /* BUSCAR FPS */
    let fps = 60;
    let data =
        fpsData[game]?.[gpu]?.[cpu]?.[resolution];
    if (
        data &&
        data[target] !== undefined
    ) {
        fps = data[target];
    }
    /* RESULTADO */
    let resultado;
    if (fps >= 144) {
        resultado =
            "Excelente rendimiento";
    }
    else {
        resultado =
            "Rendimiento mejorable";
    }
    /* TEXTO DEL OBJETIVO */
    let objetivoTexto;
    let configuracion;
    if (target === "competitive") {
        objetivoTexto =
            "Competitivo";
        configuracion =
            "Baja";
    }
    else if (target === "balanced") {
        objetivoTexto =
            "Equilibrado";
        configuracion =
            "Media / Alta";
    }
    else {
        objetivoTexto =
            "Calidad";
        configuracion =
            "Alta";
    }
    /* BARRA */
    let performance =
        Math.min((fps / 200) * 100, 100);
    /* MOSTRAR RESULTADO */
    document.getElementById("result").innerHTML =
        '<div class="result-card">' +
            '<h2>Resultado</h2>' +
            '<div class="fps-number">' +
                fps +
                ' FPS' +
            '</div>' +
            '<div class="result-info">' +
                '🎯 Objetivo: ' +
                objetivoTexto +
                '<br>' +
                '🖥️ Resolución: ' +
                resolution +
                'p<br>' +
                '⚙️ Configuración: ' +
                configuracion +
                '<br>' +
                '📊 Rendimiento: ' +
                resultado +
            '</div>' +
            '<div class="performance-bar">' +
                '<div class="performance-fill" style="width:' +
                    performance +
                    '%;"></div>' +
            '</div>' +
        '</div>';
}
</script>
</body>
</html>
