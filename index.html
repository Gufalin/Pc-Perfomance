<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Performance</title>

    <style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(88, 101, 242, 0.16),
            transparent 38%
        ),
        #0b0d12;
    color: white;
    text-align: center;
    min-height: 100vh;
}


/* =========================
   CONTENEDOR
========================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 55px 20px 70px;
}


/* =========================
   CABECERA
========================= */

h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;

    background:
        linear-gradient(
            135deg,
            #ffffff 20%,
            #aeb5ff 80%
        );

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

p {
    margin-top: 12px;
    color: #858b9b;
    font-size: 15px;
}


/* =========================
   CALCULADORA
========================= */

.calculator {
    position: relative;

    margin-top: 38px;
    padding: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(30, 34, 46, 0.96),
            rgba(19, 22, 30, 0.96)
        );

    border: 1px solid rgba(255, 255, 255, 0.07);

    border-radius: 22px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

    overflow: hidden;
}


/* Línea superior */

.calculator::before {
    content: "";

    position: absolute;

    top: 0;
    left: 10%;
    right: 10%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(88, 101, 242, 0.8),
            transparent
        );
}


/* =========================
   GRID
========================= */

.form-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 14px;

    width: 100%;
}

.form-full {
    grid-column: 1 / -1;
}


/* =========================
   SELECTORES
========================= */

select {
    appearance: none;
    -webkit-appearance: none;

    width: 100%;
    min-height: 54px;

    padding: 0 45px 0 17px;

    margin-top: 0;

    border-radius: 13px;

    border: 1px solid #303644;

    outline: none;

    background-color: #171a22;

    color: #dfe2ea;

    font-size: 15px;
    font-weight: 500;

    cursor: pointer;

    background-image:
        linear-gradient(
            45deg,
            transparent 50%,
            #777f91 50%
        ),
        linear-gradient(
            135deg,
            #777f91 50%,
            transparent 50%
        );

    background-position:
        calc(100% - 20px) 50%,
        calc(100% - 14px) 50%;

    background-size:
        6px 6px,
        6px 6px;

    background-repeat: no-repeat;

    transition:
        border-color 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

select:hover {
    background-color: #1b1f29;
    border-color: #41495a;
}

select:focus {
    border-color: #5865f2;

    background-color: #1b1f29;

    box-shadow:
        0 0 0 3px rgba(88, 101, 242, 0.12);
}

select option {
    background: #171a22;
    color: white;
}


/* =========================
   CONTENEDORES
========================= */

.game-container,
.gpu-container,
.cpu-container {
    display: flex;

    align-items: center;

    gap: 10px;

    width: 100%;

    min-width: 0;

    position: relative;

    background:
        linear-gradient(
            145deg,
            #1b1f29,
            #151820
        );

    border: 1px solid rgba(255, 255, 255, 0.07);

    border-radius: 15px;

    padding: 6px;

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025),
        0 6px 18px rgba(0, 0, 0, 0.12);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
}

.game-container:hover,
.gpu-container:hover,
.cpu-container:hover {
    border-color: rgba(255, 255, 255, 0.13);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.035),
        0 8px 22px rgba(0, 0, 0, 0.18);
}

.game-container:focus-within,
.gpu-container:focus-within,
.cpu-container:focus-within {
    border-color: rgba(88, 101, 242, 0.75);

    box-shadow:
        0 0 0 3px rgba(88, 101, 242, 0.08),
        0 8px 25px rgba(0, 0, 0, 0.2);
}


/* =========================
   SELECT DENTRO CONTENEDORES
========================= */

.game-container select,
.gpu-container select,
.cpu-container select {
    flex: 1;

    min-width: 0;

    background: transparent;

    border: none;

    box-shadow: none;
}

.game-container select:focus,
.gpu-container select:focus,
.cpu-container select:focus {
    border: none;
    box-shadow: none;
}


/* =========================
   JUEGO
========================= */

#game-preview {
    width: 51px;
    height: 48px;

    margin-right: 3px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            #222733,
            #1c2029
        );

    border: 1px solid rgba(255, 255, 255, 0.05);

    overflow: hidden;

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

#game-preview img {
    width: 40px;
    height: 40px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 4px 7px rgba(0, 0, 0, 0.4)
        );

    animation: previewAppear 0.25s ease;
}


/* =========================
   GPU
========================= */

#gpu-preview {
    flex: 0 0 155px;

    margin-right: 0;

    min-width: 0;
}

.gpu-info {
    display: flex;

    align-items: center;

    gap: 9px;

    width: 100%;

    min-height: 48px;

    padding: 5px 8px;

    background:
        linear-gradient(
            145deg,
            #222733,
            #1c2029
        );

    border: 1px solid rgba(255, 255, 255, 0.05);

    border-radius: 10px;

    text-align: left;

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

.gpu-info img {
    width: 43px;
    height: 37px;

    object-fit: contain;

    flex-shrink: 0;

    filter:
        drop-shadow(
            0 4px 7px rgba(0, 0, 0, 0.4)
        );

    animation:
        gpuAppear
        0.35s
        cubic-bezier(0.22, 1, 0.36, 1);
}

.gpu-info div {
    display: flex;
    flex-direction: column;

    min-width: 0;
}

.gpu-info strong {
    font-size: 12px;

    color: #f2f4f8;

    white-space: nowrap;
}

.gpu-info span {
    margin-top: 3px;

    color: #858c9d;

    font-size: 10px;

    white-space: nowrap;
}


/* =========================
   CPU
========================= */

#cpu-preview {
    width: 51px;
    height: 48px;

    margin-right: 3px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border-radius: 10px;

    background:
        linear-gradient(
            145deg,
            #222733,
            #1c2029
        );

    border: 1px solid rgba(255, 255, 255, 0.05);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

#cpu-preview img {
    width: 40px;
    height: 40px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 4px 7px rgba(0, 0, 0, 0.4)
        );

    animation:
        previewAppear
        0.25s
        ease;
}


/* =========================
   BOTÓN
========================= */

button {
    width: 100%;

    min-height: 64px;

    margin-top: 22px;

    padding: 0 24px;

    border:
        1px solid rgba(255, 255, 255, 0.08);

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #263b8f,
            #3156c9
        );

    color: #ffffff;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(35, 67, 160, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        filter 0.2s ease;
}

button:hover {
    transform: translateY(-2px);

    filter: brightness(1.12);

    box-shadow:
        0 12px 32px rgba(35, 67, 160, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

button:active {
    transform: translateY(0);

    box-shadow:
        0 5px 15px rgba(35, 67, 160, 0.2);
}


/* =========================
   OPCIONES CYBERPUNK
========================= */

#cyber-options {
    display: none;

    grid-column: 1 / -1;

    grid-template-columns: 1fr 1fr;

    gap: 14px;

    margin-top: 0;
}

.cyber-option {
    position: relative;

    min-height: 54px;

    padding: 0 17px;

    display: flex;

    align-items: center;

    text-align: left;

    border-radius: 15px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            #201d27,
            #171820
        );

    border: 1px solid rgba(255, 195, 80, 0.22);

    box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025),
        0 6px 18px rgba(0, 0, 0, 0.12);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
}

.cyber-option:hover {
    border-color: rgba(255, 195, 80, 0.45);

    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.2),
        0 0 20px rgba(255, 195, 80, 0.05);
}

.cyber-option label {
    width: 100%;

    color: #d9dce5;

    font-size: 13px;

    font-weight: 600;

    display: flex;

    flex-direction: column;

    gap: 3px;
}

.cyber-option small {
    color: #8c8b91;

    font-size: 10px;

    font-weight: 400;
}


/* Selects especiales Cyberpunk */

.cyber-option select {
    width: 100%;

    min-height: 42px;

    margin-top: 6px;

    padding-left: 0;
    padding-right: 35px;

    border: none;

    background-color: transparent;

    color: #f0c66a;

    font-size: 14px;

    font-weight: 700;

    box-shadow: none;

    background-position:
        calc(100% - 10px) 50%,
        calc(100% - 4px) 50%;
}

.cyber-option select:focus {
    border: none;

    box-shadow: none;

    background-color: transparent;
}

.cyber-option select option {
    background: #171820;

    color: white;
}


/* =========================
   RESULTADO PREMIUM
========================= */

#result {
    margin-top: 25px;
}

.result-card {
    position: relative;

    margin-top: 25px;

    padding: 28px;

    background:
        linear-gradient(
            145deg,
            #202531,
            #171a22
        );

    border:
        1px solid rgba(255, 255, 255, 0.08);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

    animation:
        resultAppear
        0.4s
        ease;
}


/* Brillo superior */

.result-card::before {
    content: "";

    position: absolute;

    top: 0;

    left: 15%;
    right: 15%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(88, 101, 242, 0.9),
            transparent
        );
}


/* Brillo ambiental */

.result-card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    top: -100px;
    right: -70px;

    background:
        rgba(88, 101, 242, 0.08);

    border-radius: 50%;

    filter: blur(40px);

    pointer-events: none;
}


/* =========================
   TÍTULO RESULTADO
========================= */

.result-card h2 {
    position: relative;

    margin: 0;

    font-size: 17px;

    font-weight: 600;

    color: #aeb4c3;

    letter-spacing: 0.3px;
}


/* =========================
   FPS
========================= */

.fps-number {
    position: relative;

    margin: 8px 0 18px;

    font-size: clamp(46px, 8vw, 58px);

    font-weight: 800;

    letter-spacing: -2px;

    color: #ffffff;

    text-shadow:
        0 5px 25px rgba(88, 101, 242, 0.25);
}


/* =========================
   INFORMACIÓN
========================= */

.result-info {
    position: relative;

    margin-top: 8px;

    color: #8f96a6;

    font-size: 14px;
}


/* Filas */

.result-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 11px 0;

    border-bottom:
        1px solid rgba(255, 255, 255, 0.055);
}

.result-row:last-child {
    border-bottom: none;
}

.result-row span {
    color: #777f90;

    font-size: 13px;

    font-weight: 500;
}

.result-row strong {
    color: #e8ebf2;

    font-size: 13px;

    font-weight: 600;

    text-align: right;
}


/* =========================
   BARRA
========================= */

.performance-bar {
    position: relative;

    width: 100%;

    height: 12px;

    margin-top: 20px;

    background: #10131a;

    border: 1px solid #292e39;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.35);
}

.performance-fill {
    height: 100%;

    width: 0;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #4652d8,
            #6974ff
        );

    box-shadow:
        0 0 12px rgba(88, 101, 242, 0.35);

    animation:
        fillPerformance
        0.9s
        cubic-bezier(
            0.22,
            1,
            0.36,
            1
        )
        forwards;
}


/* =========================
   ANIMACIONES
========================= */

@keyframes resultAppear {

    from {
        opacity: 0;

        transform:
            translateY(8px)
            scale(0.98);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}

@keyframes fillPerformance {

    from {
        width: 0;
    }

    to {
        width: var(--performance-width);
    }

}

@keyframes previewAppear {

    from {
        opacity: 0;

        transform:
            scale(0.85);
    }

    to {
        opacity: 1;

        transform:
            scale(1);
    }

}

@keyframes gpuAppear {

    0% {
        opacity: 0;

        transform:
            scale(0.82)
            translateY(3px);
    }

    60% {
        opacity: 1;

        transform:
            scale(1.04)
            translateY(0);
    }

    100% {
        opacity: 1;

        transform:
            scale(1);
    }

}


/* =========================
   SELECTORES SIMPLES PREMIUM
========================= */

#resolution,
#target {
    appearance: none;
    -webkit-appearance: none;

    background:
        linear-gradient(
            145deg,
            #1b1f29,
            #151820
        );

    border:
        1px solid rgba(255, 255, 255, 0.07);

    border-radius: 15px;

    color: #dfe2ea;

    min-height: 54px;

    padding:
        0 45px 0 17px;

    cursor: pointer;

    background-image:
        linear-gradient(
            45deg,
            transparent 50%,
            #777f91 50%
        ),
        linear-gradient(
            135deg,
            #777f91 50%,
            transparent 50%
        );

    background-position:
        calc(100% - 20px) 50%,
        calc(100% - 14px) 50%;

    background-size:
        6px 6px,
        6px 6px;

    background-repeat: no-repeat;

    transition:
        border-color 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
}

#resolution:hover,
#target:hover {
    background-color: #1c2029;

    border-color:
        rgba(255, 255, 255, 0.13);
}

#resolution:focus,
#target:focus {
    border-color:
        rgba(88, 101, 242, 0.75);

    box-shadow:
        0 0 0 3px rgba(88, 101, 242, 0.08);
}


/* =========================
   MÓVIL
========================= */

@media (max-width: 600px) {

    .container {
        padding:
            32px 12px 50px;
    }

    h1 {
        font-size: 34px;
    }

    p {
        font-size: 14px;
    }

    .calculator {
        margin-top: 28px;

        padding: 17px;

        border-radius: 18px;
    }

    .form-grid {
        grid-template-columns: 1fr;

        gap: 11px;
    }

    .form-full {
        grid-column: auto;
    }

    select {
        min-height: 52px;

        font-size: 14px;
    }

    #gpu-preview {
        flex: 0 0 135px;
    }

    .gpu-info {
        min-height: 52px;

        padding:
            5px 7px;
    }

    .gpu-info img {
        width: 40px;
        height: 36px;
    }

    .gpu-info strong {
        font-size: 11px;
    }

    .gpu-info span {
        font-size: 9px;
    }

    #game-preview,
    #cpu-preview {
        width: 48px;
        height: 46px;
    }

    #game-preview img,
    #cpu-preview img {
        width: 38px;
        height: 38px;
    }

    button {
        min-height: 58px;

        margin-top: 17px;
    }

    .result-card {
        padding:
            24px 17px;
    }

    .fps-number {
        font-size: 44px;
    }

    #cyber-options {
        grid-template-columns: 1fr;

        gap: 11px;
    }

    .cyber-option {
        min-height: 52px;
    }
}


/* =========================
   MÓVIL HORIZONTAL
========================= */

@media (min-width: 601px) and (max-height: 500px) {

    .container {
        padding-top: 25px;

        padding-bottom: 40px;
    }

    h1 {
        font-size: 36px;
    }

}

/* =========================
   OPCIONES CYBERPUNK
========================= */

.cyberpunk-options {
    display: none;
    grid-column: 1 / -1;
    gap: 10px;
    margin-top: -2px;
}

.cyberpunk-option {
    flex: 1;
    min-height: 46px;
    padding: 0 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #151820;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 12px;

    color: #aeb4c3;
    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        color 0.2s ease;
}

.cyberpunk-option:hover {
    background: #1a1e27;
    border-color: rgba(255, 190, 80, 0.35);
}

.cyberpunk-option.active {
    background: rgba(190, 125, 40, 0.10);
    border-color: rgba(255, 190, 80, 0.55);
    color: #f0c77a;
}

.cyberpunk-option .toggle {
    width: 32px;
    height: 18px;

    position: relative;

    background: #292e38;
    border-radius: 20px;

    transition: background 0.2s ease;
}

.cyberpunk-option .toggle::after {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    top: 3px;
    left: 3px;

    background: #858b99;
    border-radius: 50%;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.cyberpunk-option.active .toggle {
    background: rgba(190, 125, 40, 0.65);
}

.cyberpunk-option.active .toggle::after {
    transform: translateX(14px);
    background: #ffffff;
}

@media (max-width: 600px) {
    .cyberpunk-options {
        display: none;
        flex-direction: column;
    }

    .cyberpunk-option {
        width: 100%;
    }
}

    </style>
</head>


<body>

<div class="container">

    <h1>PC Performance</h1>

    <p>
        Calcula el rendimiento estimado de tu PC.
    </p>


    <div class="calculator">


        <!-- =========================
             SELECCIÓN
        ========================= -->

        <div class="form-grid">


            <!-- JUEGO -->

            <div class="game-container form-full">

                <select
                    id="game"
                    onchange="showGame()"
                >

                    <option value="">
                        Juego...
                    </option>

                    <option value="fortnite">
                        Fortnite
                    </option>

                    <option value="cyberpunk">
                        Cyberpunk 2077
                    </option>

                    <option value="warzone">
                        Call of Duty: Warzone
                    </option>

                </select>


                <div id="game-preview"></div>

            </div>


            <!-- GPU -->

            <div class="gpu-container">

                <select
                    id="gpu"
                    onchange="showGPU()"
                >

                    <option value="">
                        GPU...
                    </option>

                    <option value="rtx3080">
                        RTX 3080
                    </option>

                    <option value="rtx4070">
                        RTX 4070
                    </option>

                    <option value="rtx5070">
                        RTX 5070
                    </option>

                </select>


                <div id="gpu-preview"></div>

            </div>


            <!-- CPU -->

            <div class="cpu-container">

                <select
                    id="cpu"
                    onchange="showCPU()"
                >

                    <option value="">
                        CPU...
                    </option>

                    <option value="i5-14600kf">
                        i5-14600KF
                    </option>

                    <option value="ryzen 7 7800X3D">
                        Ryzen 7 7800X3D
                    </option>

                    <option value="ryzen 5 7600">
                        Ryzen 5 7600
                    </option>

                </select>


                <div id="cpu-preview"></div>

            </div>


            <!-- RESOLUCIÓN -->

            <select id="resolution">

                <option value="">
                    Resolución...
                </option>

                <option value="1080">
                    1080p
                </option>

                <option value="1440">
                    1440p
                </option>

                <option value="2160">
                    4K
                </option>

            </select>


            <!-- OBJETIVO -->

            <select id="target">

                <option value="">
                    Objetivo...
                </option>

                <option value="competitive">
                    Competitivo
                </option>

                <option value="balanced">
                    Equilibrado
                </option>

                <option value="quality">
                    Calidad

/* =========================

========================= */

function showGame() {

    let game =
        document.getElementById("game").value;

    if (game === "fortnite") {

        document.getElementById("game-preview").innerHTML =
            '<img src="./fortnite.PNG">';

    }
    else if (game === "cyberpunk") {

        document.getElementById("game-preview").innerHTML =
            '<img src="./cyberpunk.JPG">';

        document.getElementById("cyberpunk-options").style.display =
            "flex";

    }
    else if (game === "warzone") {

        document.getElementById("game-preview").innerHTML =
            '<img src="./warzone.PNG">';

    }
    else {

        document.getElementById("game-preview").innerHTML = "";

    }

    if (game !== "cyberpunk") {

        document.getElementById("cyberpunk-options").style.display =
            "none";

        document.getElementById("raytracing-option")
            .classList.remove("active");

        document.getElementById("framegen-option")
            .classList.remove("active");

    }
}

function toggleCyberpunkOption(option) {

    let element;

    if (option === "raytracing") {
        element =
            document.getElementById("raytracing-option");
    }

    if (option === "framegen") {
        element =
            document.getElementById("framegen-option");
    }

    element.classList.toggle("active");
}

/* =========================
   CALCULAR FPS
========================= */

function calculateFPS() {


    let game =
        document.getElementById("game").value;


    let gpu =
        document.getElementById("gpu").value;


    let cpu =
        document.getElementById("cpu").value;


    let resolution =
        document.getElementById("resolution").value;


    let target =
        document.getElementById("target").value;


    /* =========================
       COMPROBAR CAMPOS
    ========================= */

    if (
        !game ||
        !gpu ||
        !cpu ||
        !resolution ||
        !target
    ) {

        document.getElementById("result").innerHTML =
            "Selecciona todos los campos.";

        return;

    }


    /* =========================
       VARIABLES
    ========================= */

    let fps = 60;

    let objetivoTexto;

    let configuracion;


    /* =================================================
       CYBERPUNK
    ================================================= */

    if (game === "cyberpunk") {


        /* Comprobar opciones */

        let raytracing =
            document.getElementById("raytracing").value;


        let framegeneration =
            document.getElementById("framegeneration").value;


        /* Datos base */

        let cyberData =
            fpsData.cyberpunk?.[gpu]?.[cpu]?.[resolution];


        if (
            cyberData &&
            cyberData[target] !== undefined
        ) {

            fps =
                cyberData[target];

        }


        /* =========================
           RAY TRACING
        ========================= */

        if (raytracing === "on") {

            /*
                Penalización aproximada
                por activar RT.
            */

            fps =
                Math.round(
                    fps * 0.68
                );

        }


        /* =========================
           FRAME GENERATION
        ========================= */

        if (framegeneration === "on") {

            /*
                Aumento aproximado
                de FPS percibidos.
            */

            fps =
                Math.round(
                    fps * 1.65
                );

        }


        /* =========================
           OBJETIVO CYBERPUNK
        ========================= */

        if (target === "low") {

            objetivoTexto =
                "Bajo";

            configuracion =
                "Baja";

        }

        else if (target === "balanced") {

            objetivoTexto =
                "Equilibrado";

            configuracion =
                "Media / Alta";

        }

        else {

            objetivoTexto =
                "Calidad";

            configuracion =
                "Alta";

        }


    }


    /* =================================================
       FORTNITE
    ================================================= */

    else {


        let data =
            fpsData[game]?.[gpu]?.[cpu]?.[resolution];


        if (
            data &&
            data[target] !== undefined
        ) {

            fps =
                data[target];

        }


        /* Resultado */

        if (target === "competitive") {

            objetivoTexto =
                "Competitivo";

            configuracion =
                "Baja";

        }

        else if (target === "balanced") {

            objetivoTexto =
                "Equilibrado";

            configuracion =
                "Media / Alta";

        }

        else {

            objetivoTexto =
                "Calidad";

            configuracion =
                "Alta";

        }

    }


    /* =========================
       RESULTADO
    ========================= */

    let resultado;


    if (fps >= 144) {

        resultado =
            "Excelente rendimiento";

    }

    else if (fps >= 60) {

        resultado =
            "Buen rendimiento";

    }

    else {

        resultado =
            "Rendimiento mejorable";

    }


    /* =========================
       INFORMACIÓN EXTRA
    ========================= */

    let extraHTML = "";


    if (game === "cyberpunk") {


        let raytracing =
            document.getElementById("raytracing").value;


        let framegeneration =
            document.getElementById("framegeneration").value;


        extraHTML +=

            '<div class="result-row">' +

                '<span>Ray Tracing</span>' +

                '<strong>' +

                    (
                        raytracing === "on"
                        ? "Activado"
                        : "Desactivado"
                    ) +

                '</strong>' +

            '</div>';


        extraHTML +=

            '<div class="result-row">' +

                '<span>Frame Generation</span>' +

                '<strong>' +

                    (
                        framegeneration === "on"
                        ? "Activado"
                        : "Desactivado"
                    ) +

                '</strong>' +

            '</div>';

    }


    /* =========================
       BARRA
    ========================= */

    let performance =
        Math.min(
            (fps / 200) * 100,
            100
        );


    /* =========================
       MOSTRAR RESULTADO
    ========================= */

    document.getElementById("result").innerHTML =

        '<div class="result-card">' +

            '<h2>Resultado</h2>' +

            '<div class="fps-number">' +

                fps +

                ' FPS' +

            '</div>' +


            '<div class="result-info">' +


                '<div class="result-row">' +

                    '<span>Objetivo</span>' +

                    '<strong>' +

                        objetivoTexto +

                    '</strong>' +

                '</div>' +


                '<div class="result-row">' +

                    '<span>Resolución</span>' +

                    '<strong>' +

                        resolution +

                        'p' +

                    '</strong>' +

                '</div>' +


                '<div class="result-row">' +

                    '<span>Configuración</span>' +

                    '<strong>' +

                        configuracion +

                    '</strong>' +

                '</div>' +


                extraHTML +


                '<div class="result-row">' +

                    '<span>Rendimiento</span>' +

                    '<strong>' +

                        resultado +

                    '</strong>' +

                '</div>' +


            '</div>' +


            '<div class="performance-bar">' +

                '<div ' +

                    'class="performance-fill" ' +

                    'style="--performance-width:' +

                        performance +

                        '%;"' +

                '></div>' +

            '</div>' +


        '</div>';

}
